name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Tidy check
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod/go.sum are out of sync with the code; commit the tidied files"
            git diff go.mod go.sum
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Cross-compile check (arm64)
        run: |
          for cmd in mortard sunderd; do
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/$cmd
          done

  images:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build mortar (amd64 + arm64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mortar
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build sunder (amd64 + arm64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: sunder
          platforms: linux/amd64,linux/arm64
          push: false
