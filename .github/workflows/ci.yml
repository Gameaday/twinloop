name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Self-healing gate: strict drift check once go.sum is committed
      # (the go-sum workflow maintains it), lenient before that. No
      # developer machine needs Go installed.
      - name: Tidy
        run: |
          go mod tidy
          if git ls-files --error-unmatch go.sum >/dev/null 2>&1; then
            if ! git diff --quiet go.mod go.sum; then
              echo "::error::go.mod/go.sum drifted from the code; the go-sum workflow or a maintainer must commit the tidied files"
              git diff go.mod go.sum
              exit 1
            fi
          else
            echo "::notice::go.sum not yet committed; module sums generated on the runner for this run only"
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Cross-compile check (arm64)
        run: |
          for cmd in mortard sunderd; do
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/$cmd
          done

  images:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build mortar (amd64 + arm64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mortar
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build sunder (amd64 + arm64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: sunder
          platforms: linux/amd64,linux/arm64
          push: false
